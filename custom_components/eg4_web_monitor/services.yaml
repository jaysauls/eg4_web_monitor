refresh_data:
  name: Refresh EG4 Data
  description: Force refresh of all EG4 inverter data from the API
  fields:
    entry_id:
      name: Config Entry ID
      description: The configuration entry ID to refresh (optional, refreshes all if not specified)
      required: false
      selector:
        text:

reconcile_history:
  name: Reconcile Energy History
  description: >-
    Backfill missing energy statistics from the EG4 cloud API.
    This service fetches historical energy data and imports it into Home Assistant's
    statistics database for any gaps in your energy sensor history.
    Requires cloud credentials (HTTP or Hybrid connection mode).
  fields:
    lookback_hours:
      name: Lookback Hours
      description: "Number of hours to look back for gaps (default: 48)"
      required: false
      default: 48
      selector:
        number:
          min: 1
          max: 8760
          step: 1
          mode: box
          unit_of_measurement: hours
    start_date:
      name: Start Date
      description: Explicit start date (YYYY-MM-DD). If provided, end_date is also required.
      required: false
      example: "2025-01-01"
      selector:
        date:
    end_date:
      name: End Date
      description: Explicit end date (YYYY-MM-DD). If provided, start_date is also required.
      required: false
      example: "2025-01-31"
      selector:
        date:
    entry_id:
      name: Config Entry ID
      description: The configuration entry ID to reconcile (optional, reconciles all if not specified)
      required: false
      selector:
        text:

set_storm_mode:
  name: Set Storm Mode
  description: >-
    Enable or disable storm mode for an EG4 device. When enabled, the AC charge
    schedule is overridden to charge the battery from the grid around the clock
    (00:00–23:59). The original schedule is saved and restored when storm mode is
    disabled. Requires cloud credentials (HTTP or Hybrid connection mode).
  fields:
    serial:
      name: Device Serial
      description: Serial number of the inverter or GridBOSS device.
      required: true
      example: "1234567890"
      selector:
        text:
    enable:
      name: Enable
      description: Set to true to enable storm mode, false to disable and restore the previous schedule.
      required: true
      selector:
        boolean:
    soc_limit:
      name: SOC Limit
      description: "Battery SOC charge limit while storm mode is active (default: 100%)."
      required: false
      default: 100
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
          unit_of_measurement: "%"
